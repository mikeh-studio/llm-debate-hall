name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/multi-agent-council-pyc
        run: python -m compileall -q llm_debate_hall tests
      - name: Run mock startup smoke
        env:
          MULTI_AGENT_COUNCIL_ENABLE_MOCK_PRESET: "true"
        run: pytest -q tests/test_mock_startup_smoke.py
      - name: Run backend tests
        run: pytest -q
      - name: Check frontend syntax
        run: node --check llm_debate_hall/static/app.js
